name: ACCP tip-of-main AWS-LC CI

# Build the pull request's ACCP against the tip of AWS-LC's main branch instead of
# the tags build.gradle pins, then run the full JUnit suite -- once in non-FIPS
# mode and once in regular FIPS mode.
#
# Every other ACCP job links a pinned AWS-LC, which means a change in AWS-LC main
# that alters what libcrypto can *do* -- a newly added algorithm decoder, a newly
# retained key field -- is invisible to ACCP's CI until the pin moves. Any ACCP
# test that infers a libcrypto capability from its own build flavor rather than
# probing for it silently rots in the meantime. AWS-LC runs the mirror image of
# these jobs (ACCP main against the AWS-LC pull request) as a required check, so
# the drift surfaces there instead: as a red AWS-LC build that an ACCP author
# never sees. These jobs move that signal to the side of the boundary that can
# act on it.
#
# They are advisory only, and deliberately not added to branch protection: they
# track a moving upstream and so can go red for reasons that have nothing to do
# with the pull request under test.
#
# Workflow syntax:
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

on:
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

env:
  # Amazon Linux 2023 ships Corretto 17.0.19, which predates the javax.crypto.KEM
  # backport that ACCP's ML-KEM Multi-Release overlay needs at build time, so both
  # build and test on Corretto 21, where the KEM API is GA.
  JAVA_HOME: /usr/lib/jvm/java-21-amazon-corretto
  TEST_JAVA_HOME: /usr/lib/jvm/java-21-amazon-corretto

jobs:
  al2023-latest-awslc:
    # GitHub offers no Amazon Linux 2023 runner label, so run the AL2023 userland
    # in a container on an Ubuntu runner.
    name: AL2023 ${{ matrix.label }} vs AWS-LC main
    runs-on: ubuntu-latest
    container:
      image: amazonlinux:2023
    strategy:
      # The two modes exercise different AWS-LC code paths, so a failure in one
      # says nothing about the other. Always run both.
      fail-fast: false
      matrix:
        include:
          - label: non-FIPS
            fips_flag: ''
          - label: FIPS
            fips_flag: '--fips'
    steps:
      # Install before checking out: when git is missing from the container,
      # actions/checkout falls back to a REST API tarball with no .git directory,
      # which breaks the AWS-LC clone the build performs below.
      - name: Install build dependencies
        run: |
          # java-21-amazon-corretto is the non-headless JDK, needed alongside
          # -devel purely for lib/libjawt.so: CMake's FindJNI insists on
          # JAVA_AWT_LIBRARY, and the -devel package pulls in only the headless
          # JDK, so without it :executeCmake fails at find_package(JNI).
          # libstdc++-static supplies the libstdc++.a that ACCP's
          # -static-libstdc++ link needs; CMake's probe for that flag only
          # compiles, so without the package the failure surfaces as
          # "cannot find -lstdc++" when libamazonCorrettoCryptoProvider.so links.
          dnf -y install \
            java-21-amazon-corretto-devel java-21-amazon-corretto \
            gcc gcc-c++ libstdc++-static make cmake perl golang git tar gzip \
            which findutils diffutils lcov python3-pip
          pip3 install gcovr
      - uses: actions/checkout@v4
        with:
          # The pinned submodule is never read: --latest-awslc clones AWS-LC main
          # into build/awslc-src and points the build at it with -DAWSLC_SRC_DIR.
          submodules: false
      - name: Build and run the full JUnit suite
        run: |
          # --target-jdk-version 21 is required for the tst/.../jdk17plus tests
          # (ML-KEM among them) to be compiled and run at all.
          ./tests/ci/run_accp_basic_tests.sh \
            --latest-awslc \
            ${{ matrix.fips_flag }} \
            --lcov-ignore inconsistent \
            --target-jdk-version 21
