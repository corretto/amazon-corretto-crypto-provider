name: ACCP release build

# Builds the unsigned linux jars (non-FIPS and FIPS), then signs them in a fan-in job.
# signing-keys=test signs with throwaway keys; those jars are NOT releasable (the self-signed JCE
# cert fails Maven Central's signature enforcement, even though the jar loads fine as a provider on
# most JDKs). signing-keys=release signs with the production keys. Every job runs on the
# CodeBuild-hosted runners, which only serve
# corretto/amazon-corretto-crypto-provider; on a fork the jobs queue and never start.
# Only manually triggered: the release sign job runs on a runner that holds the signing secrets,
# so this workflow must never run on pull_request or pull_request_target.
on:
  workflow_dispatch:
    inputs:
      signing-keys:
        description: Keys for the sign job (none skips signing)
        type: choice
        options: [test, release, none]
        default: test

permissions:
  contents: read

jobs:
  build-linux:
    name: Build ${{ matrix.platform }} (${{ matrix.fips && 'FIPS' || 'non-FIPS' }})
    # CodeBuild-hosted runners (AccpPublicReleaseCDK GhaRunners stack), one project per arch. The
    # project's fleet sets the instance size. Each job gets a unique label so GitHub routes it only
    # to the runner created for it.
    runs-on:
      - codebuild-accp-gha-${{ matrix.codebuild-arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - build-${{ matrix.platform }}-${{ matrix.fips && 'fips' || 'nonfips' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch_64]
        fips: [false, true]
        include:
          - platform: linux-x86_64
            codebuild-arch: x86_64
          - platform: linux-aarch_64
            codebuild-arch: aarch64
    steps:
      # The AL2023 runner image may lack parts of the AWS-LC toolchain (see Dockerfile.dev).
      # libstdc++-static provides libstdc++.a for the -static-libstdc++ link in CMakeLists.txt.
      - name: Install build tools
        run: dnf install -y --setopt=install_weak_deps=False cmake gcc gcc-c++ libstdc++-static make perl golang git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # Corretto 17 is the build JDK: it exposes the javax.crypto.KEM API needed to
      # compile the ML-KEM Multi-Release overlay. The jar still targets JDK 8.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build
        run: ./gradlew -DFIPS=${{ matrix.fips }} release_jars

      - name: Record jar hashes
        run: |
          cd build/release
          sha256sum *.jar | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accp-${{ matrix.platform }}${{ matrix.fips && '-fips' || '' }}
          path: build/release/*.jar
          if-no-files-found: error

  sign:
    name: Sign (${{ inputs.signing-keys }} keys)
    needs: build-linux
    if: inputs.signing-keys != 'none'
    runs-on:
      - codebuild-accp-gha-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
      - sign
    env:
      AWS_REGION: us-west-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tests/ci/release
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      # Every build job emits sources/javadoc jars; ship the x86_64 copies, as fakePublish does.
      - name: Assemble
        run: |
          mkdir signed
          cp dist/*/*-linux-*.jar signed/
          cp dist/accp-linux-x86_64/*-sources.jar dist/accp-linux-x86_64/*-javadoc.jar signed/
          cp dist/accp-linux-x86_64-fips/*-sources.jar dist/accp-linux-x86_64-fips/*-javadoc.jar signed/
          ls -l signed

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'corretto'

      # Loads keys, signs, verifies, and shreds the keys in one process.
      - name: Sign and verify
        run: tests/ci/release/sign.sh ${{ inputs.signing-keys }} signed

      - name: Record hashes
        run: |
          cd signed
          sha256sum *.jar *.asc | tee -a "$GITHUB_STEP_SUMMARY"

      # Release-signed jars are not uploaded: on a public repo, any workflow artifact is
      # downloadable, and these would be production-signed builds of an unreleased commit.
      # Publishing to Maven Central will consume them directly from this job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.signing-keys != 'release'
        with:
          name: accp-signed-${{ inputs.signing-keys }}
          path: signed/
          if-no-files-found: error

  # Loads each signed platform jar as the JCA provider on every supported JDK.
  smoke-test:
    name: Smoke ${{ matrix.platform }}${{ matrix.fips && ' FIPS' || '' }} on JDK ${{ matrix.jdk }}
    needs: sign
    if: inputs.signing-keys == 'test'
    runs-on:
      - codebuild-accp-gha-${{ matrix.codebuild-arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - smoke-${{ matrix.platform }}-${{ matrix.fips && 'fips' || 'nonfips' }}-jdk${{ matrix.jdk }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch_64]
        fips: [false, true]
        jdk: ['8', '11', '17', '21', '25']
        include:
          - platform: linux-x86_64
            codebuild-arch: x86_64
          - platform: linux-aarch_64
            codebuild-arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tests/ci/release
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accp-signed-${{ inputs.signing-keys }}
          path: signed

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'corretto'

      - name: Run smoke test
        run: |
          prefix=AmazonCorrettoCryptoProvider${{ matrix.fips && '-FIPS' || '' }}
          jar=$(ls signed/$prefix-[0-9]*-${{ matrix.platform }}.jar)
          version=$(basename "$jar" | sed -E "s/^$prefix-(.+)-${{ matrix.platform }}\.jar$/\1/")
          mkdir classes
          javac -cp "$jar" -d classes tests/ci/release/ReleaseSmokeTest.java
          java -cp "$jar:classes" ReleaseSmokeTest "$version" ${{ matrix.fips }}
          if [ "${{ matrix.jdk }}" -ge 17 ]; then
            javac -cp "$jar" -d classes tests/ci/release/ReleaseSmokeTestMlKem.java
            java -cp "$jar:classes" ReleaseSmokeTestMlKem
          fi
