name: ACCP release build

# Builds the unsigned linux jars (non-FIPS and FIPS), then signs them in a fan-in job.
# signing-keys=test signs with throwaway keys; those jars are NOT releasable: the throwaway GPG key
# is on no public keyserver, so Central Portal validation rejects them, and Oracle JDK rejects the
# self-signed JCE cert (OpenJDK-based JDKs do not check provider signers, so the jar still loads
# there). signing-keys=release signs with the production keys. See tests/ci/release/README.md. Every job runs on the
# CodeBuild-hosted runners, which only serve
# corretto/amazon-corretto-crypto-provider; on a fork the jobs queue and never start.
# Only manually triggered: the release sign job runs on a runner that holds the signing secrets,
# so this workflow must never run on pull_request or pull_request_target.
on:
  workflow_dispatch:
    inputs:
      signing-keys:
        description: Keys for the sign job (none skips signing)
        type: choice
        options: [test, release, none]
        default: test

permissions:
  contents: read

jobs:
  build-linux:
    name: Build ${{ matrix.platform }} (${{ matrix.fips && 'FIPS' || 'non-FIPS' }})
    # CodeBuild-hosted runners (AccpPublicReleaseCDK GhaRunners stack), one project per arch. The
    # project's fleet sets the instance size. Each job gets a unique label so GitHub routes it only
    # to the runner created for it.
    runs-on:
      - codebuild-accp-gha-${{ matrix.codebuild-arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - build-${{ matrix.platform }}-${{ matrix.fips && 'fips' || 'nonfips' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch_64]
        fips: [false, true]
        include:
          - platform: linux-x86_64
            codebuild-arch: x86_64
          - platform: linux-aarch_64
            codebuild-arch: aarch64
    steps:
      # The AL2023 runner image may lack parts of the AWS-LC toolchain (see Dockerfile.dev).
      # libstdc++-static provides libstdc++.a for the -static-libstdc++ link in CMakeLists.txt.
      - name: Install build tools
        run: dnf install -y --setopt=install_weak_deps=False cmake gcc gcc-c++ libstdc++-static make perl golang git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # Corretto 17 is the build JDK: it exposes the javax.crypto.KEM API needed to
      # compile the ML-KEM Multi-Release overlay. The jar still targets JDK 8.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build
        run: ./gradlew -DFIPS=${{ matrix.fips }} release_jars release_portal_metadata

      - name: Record jar hashes
        run: |
          cd build/release
          sha256sum *.jar | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accp-${{ matrix.platform }}${{ matrix.fips && '-fips' || '' }}
          path: build/release/*.jar
          if-no-files-found: error

      # One copy per variant is enough: the POM and empty jar are not platform-specific.
      - if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accp-portal-metadata${{ matrix.fips && '-fips' || '' }}
          path: build/portal-metadata/*
          if-no-files-found: error

  # Loads each unsigned platform jar as the JCA provider on every supported JDK, in every mode.
  # Unsigned is enough: OpenJDK-based JDKs do not check provider signers, and the sign job verifies
  # the signatures itself.
  smoke-test:
    name: Smoke ${{ matrix.platform }}${{ matrix.fips && ' FIPS' || '' }} on JDK ${{ matrix.jdk }}
    needs: build-linux
    runs-on:
      - codebuild-accp-gha-${{ matrix.codebuild-arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - smoke-${{ matrix.platform }}-${{ matrix.fips && 'fips' || 'nonfips' }}-jdk${{ matrix.jdk }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch_64]
        fips: [false, true]
        jdk: ['17', '25']
        include:
          - platform: linux-x86_64
            codebuild-arch: x86_64
          - platform: linux-aarch_64
            codebuild-arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tests/ci/release
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accp-${{ matrix.platform }}${{ matrix.fips && '-fips' || '' }}
          path: jars

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'corretto'

      - name: Run smoke test
        run: tests/ci/release/smoke-test.sh jars ${{ matrix.platform }} ${{ matrix.fips }} ${{ matrix.jdk }}

  sign:
    name: Sign (${{ inputs.signing-keys }} keys)
    # Smoke tests gate signing, so a broken build is never production-signed or staged.
    needs: [build-linux, smoke-test]
    if: inputs.signing-keys != 'none'
    runs-on:
      - codebuild-accp-gha-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
      - sign
    env:
      AWS_REGION: us-west-2
    outputs:
      staged-artifact-id: ${{ steps.upload-staged.outputs.artifact-id }}
    steps:
      # Only the release scripts: this runner can read the signing secrets and the Portal token, so
      # it runs no build tooling.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tests/ci/release
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      # Every build job emits sources/javadoc jars; ship the x86_64 copies, as fakePublish does.
      - name: Assemble
        run: |
          mkdir signed
          cp dist/*/*-linux-*.jar signed/
          cp dist/accp-linux-x86_64/*-sources.jar dist/accp-linux-x86_64/*-javadoc.jar signed/
          cp dist/accp-linux-x86_64-fips/*-sources.jar dist/accp-linux-x86_64-fips/*-javadoc.jar signed/
          cp dist/accp-portal-metadata*/* signed/
          ls -l signed

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'corretto'

      # Loads keys, signs, verifies, and shreds the keys in one process.
      - name: Sign and verify
        run: tests/ci/release/sign.sh ${{ inputs.signing-keys }} signed

      - name: Record hashes
        run: |
          cd signed
          sha256sum *.jar *.asc | tee -a "$GITHUB_STEP_SUMMARY"


      # FIPS and non-FIPS are separate Maven coordinates, so each gets its own bundle and Portal
      # deployment. Staging only: publish.sh stops at VALIDATED, and the upload is USER_MANAGED, so
      # nothing reaches Maven Central until a person publishes it in the Portal UI.
      - name: Build Portal bundles
        if: inputs.signing-keys == 'release'
        run: python3 tests/ci/release/portal_bundle.py signed bundles

      # publish.sh also downloads the platform jars back from each VALIDATED deployment and checks
      # they match the bundle, so the staged-test jobs test exactly what is staged.
      - name: Upload Portal bundles to staging
        if: inputs.signing-keys == 'release'
        env:
          STAGED_JARS_DIR: staged
        run: |
          for bundle in bundles/central-bundle-*.zip; do
            tests/ci/release/publish.sh "$bundle"
          done

      # This is the only place production-signed jars leave this job as a workflow artifact. On a
      # public repo any signed-in user can download it. The aarch64 staged test needs the jars on
      # another runner, and the alternative is reading the Portal token, which can publish, there.
      # delete-staged-artifact removes the artifact once the staged tests finish, and the one-day
      # retention covers the case where that job never runs.
      - id: upload-staged
        if: inputs.signing-keys == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accp-staged-release
          path: staged/*.jar
          retention-days: 1
          if-no-files-found: error

  # Smoke-tests the jars downloaded back from Portal staging: the signed bytes a release would
  # publish. One JDK, because smoke-test already covered the JDK range on the same code before
  # signing; this pass checks that signing and staging left the jars intact, including the
  # META-INF/versions overlay that ReleaseSmokeTestMlKem loads.
  staged-test:
    name: Staged ${{ matrix.platform }}${{ matrix.fips && ' FIPS' || '' }} on JDK 17
    needs: sign
    if: inputs.signing-keys == 'release'
    runs-on:
      - codebuild-accp-gha-${{ matrix.codebuild-arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - staged-${{ matrix.platform }}-${{ matrix.fips && 'fips' || 'nonfips' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch_64]
        fips: [false, true]
        include:
          - platform: linux-x86_64
            codebuild-arch: x86_64
          - platform: linux-aarch_64
            codebuild-arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tests/ci/release
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accp-staged-release
          path: jars

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Verify JCE signature
        run: |
          prefix=AmazonCorrettoCryptoProvider${{ matrix.fips && '-FIPS' || '' }}
          jarsigner -verify -verbose -certs jars/$prefix-[0-9]*-${{ matrix.platform }}.jar | grep -q "jar verified"

      - name: Run smoke test
        run: tests/ci/release/smoke-test.sh jars ${{ matrix.platform }} ${{ matrix.fips }} 17

  # Runs even when a staged test fails, so the production-signed artifact never outlives the run.
  delete-staged-artifact:
    name: Delete staged-jar artifact
    needs: [sign, staged-test]
    if: always() && needs.sign.outputs.staged-artifact-id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.sign.outputs.staged-artifact-id }}
        run: gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID"
