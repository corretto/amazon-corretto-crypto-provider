name: ACCP release build

# Builds the unsigned linux jars (non-FIPS and FIPS), then signs them in a fan-in job.
# signing-keys=test signs with throwaway keys; those jars are NOT releasable (the JCE cert is
# self-signed, so OracleJDK will refuse to load them as a provider). signing-keys=release signs with
# the production keys on the CodeBuild runner, which only exists for corretto/amazon-corretto-crypto-provider.
# Only manually triggered: the release sign job runs on a runner that holds the signing secrets,
# so this workflow must never run on pull_request or pull_request_target.
on:
  workflow_dispatch:
    inputs:
      signing-keys:
        description: Keys for the sign job (none skips signing)
        type: choice
        options: [test, release, none]
        default: test

permissions:
  contents: read

jobs:
  build-linux:
    name: Build ${{ matrix.platform }} (${{ matrix.fips && 'FIPS' || 'non-FIPS' }})
    # Swap to the CodeBuild runner labels once the fleet exists:
    # codebuild-accp-gha-<arch>-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch_64]
        fips: [false, true]
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch_64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # Corretto 17 is the build JDK: it exposes the javax.crypto.KEM API needed to
      # compile the ML-KEM Multi-Release overlay. The jar still targets JDK 8.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build
        run: ./gradlew -DFIPS=${{ matrix.fips }} release_jars

      - name: Record jar hashes
        run: |
          cd build/release
          sha256sum *.jar | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accp-${{ matrix.platform }}${{ matrix.fips && '-fips' || '' }}
          path: build/release/*.jar
          if-no-files-found: error

  sign:
    name: Sign (${{ inputs.signing-keys }} keys)
    needs: build-linux
    if: inputs.signing-keys != 'none'
    runs-on: ${{ inputs.signing-keys == 'release' && format('codebuild-accp-gha-x86_64-{0}-{1}', github.run_id, github.run_attempt) || 'ubuntu-24.04' }}
    env:
      AWS_REGION: us-west-2
      KEYS_DIR: ${{ github.workspace }}/../signing-keys
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      # Every build job emits sources/javadoc jars; ship the x86_64 copies, as fakePublish does.
      - name: Assemble
        run: |
          mkdir signed
          cp dist/*/*-linux-*.jar signed/
          cp dist/accp-linux-x86_64/*-sources.jar dist/accp-linux-x86_64/*-javadoc.jar signed/
          cp dist/accp-linux-x86_64-fips/*-sources.jar dist/accp-linux-x86_64-fips/*-javadoc.jar signed/
          ls -l signed

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'corretto'

      # JKS matches the format of the production keystore.
      - name: Generate throwaway keys
        if: inputs.signing-keys == 'test'
        run: |
          export KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYSTORE=$RUNNER_TEMP/accp-test.jks" >> "$GITHUB_ENV"
          echo "JCE_ALIAS=accp-test" >> "$GITHUB_ENV"
          echo "JCE_SIGNER=CN=ACCP test signing" >> "$GITHUB_ENV"
          echo "GPG_UID=accp-test@invalid" >> "$GITHUB_ENV"
          mkdir -p "$KEYS_DIR" && : > "$KEYS_DIR/gpg-passphrase"
          echo "GPG_PASSPHRASE_FILE=$KEYS_DIR/gpg-passphrase" >> "$GITHUB_ENV"
          keytool -genkeypair -alias accp-test -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=ACCP test signing" -storetype JKS -keystore "$RUNNER_TEMP/accp-test.jks" \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-gen-key "ACCP test signing <accp-test@invalid>" rsa3072 sign 1d
          gpg --armor --export accp-test@invalid > signed/signing-key.pub

      # Same material and layout as the Staging buildspec in AccpPublicReleaseCDK
      # (fetchSecretsCommands / SIGNING_SECRETS_CONFIG). Secret values are masked and kept in
      # files under KEYS_DIR, which the cleanup step shreds.
      - name: Load release keys
        if: inputs.signing-keys == 'release'
        run: |
          umask 077
          mkdir -p "$KEYS_DIR/gnupg"
          bucket=838297025124.us-west-2.provider-signing-material
          aws s3 cp --quiet "s3://$bucket/accp_signing_key_full_2024.jks" "$KEYS_DIR/accp.jks"
          aws s3 cp --quiet "s3://$bucket/accp_gradle_2024.properties" "$KEYS_DIR/gradle.properties"
          aws s3 cp --quiet "s3://$bucket/mvn_gpg.tgz" "$KEYS_DIR/mvn_gpg.tgz"
          tar -xzpf "$KEYS_DIR/mvn_gpg.tgz" -C "$KEYS_DIR"

          field() {
            aws secretsmanager get-secret-value --secret-id "$1" --query SecretString --output text \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['$2'], end='')"
          }
          KEYSTORE_PASSWORD=$(field provider-signing-kestore-password-2024 password)
          echo "::add-mask::$KEYSTORE_PASSWORD"
          field gpg-signing password > "$KEYS_DIR/gpg-passphrase"
          echo "::add-mask::$(cat "$KEYS_DIR/gpg-passphrase")"
          GPG_KEYID=$(field gpg-signing keyId)

          alias=$(sed -n 's/^jcecertAlias=//p' "$KEYS_DIR/gradle.properties" | tr -d '\r')
          [[ -n "$alias" ]] || { echo "::error::jcecertAlias not found in gradle.properties"; exit 1; }

          export GNUPGHOME="$KEYS_DIR/gnupg"
          find "$KEYS_DIR/mvn_gpg" -type f -print0 | while IFS= read -r -d '' f; do
            gpg --batch --pinentry-mode loopback --passphrase-file "$KEYS_DIR/gpg-passphrase" \
              --import "$f" 2>/dev/null || true
          done
          gpg --batch --list-secret-keys "$GPG_KEYID" > /dev/null \
            || { echo "::error::GPG secret key $GPG_KEYID not found in mvn_gpg.tgz"; exit 1; }
          gpg --batch --armor --export "$GPG_KEYID" > signed/signing-key.pub

          {
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEYSTORE=$KEYS_DIR/accp.jks"
            echo "JCE_ALIAS=$alias"
            echo "JCE_SIGNER=CN=Amazon Web Services, OU=Java Software Code Signing, O=Oracle Corporation"
            echo "GPG_UID=$GPG_KEYID"
            echo "GPG_PASSPHRASE_FILE=$KEYS_DIR/gpg-passphrase"
            echo "GNUPGHOME=$GNUPGHOME"
          } >> "$GITHUB_ENV"

      # Only the platform jars carry a JCE signature, matching fakePublish.
      - name: JCE-sign and verify
        run: |
          for jar in signed/*-linux-*.jar; do
            jarsigner -keystore "$KEYSTORE" -storepass:env KEYSTORE_PASSWORD \
              -tsa http://timestamp.digicert.com "$jar" "$JCE_ALIAS"
            jarsigner -verify -verbose -certs "$jar" > jarsigner.log
            grep -q "jar verified" jarsigner.log
            grep -q "Signed by \"$JCE_SIGNER\"" jarsigner.log
            echo "$jar: JCE signature verified"
          done

      - name: GPG-sign and verify
        run: |
          cd signed
          for f in *.jar; do
            gpg --batch --pinentry-mode loopback --passphrase-file "$GPG_PASSPHRASE_FILE" \
              --armor --detach-sign --local-user "$GPG_UID" "$f"
            gpg --batch --verify "$f.asc" "$f"
          done

      - name: Record hashes
        run: |
          cd signed
          sha256sum *.jar *.asc | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Shred keys
        if: always()
        run: |
          [[ -d "$KEYS_DIR" ]] || exit 0
          find "$KEYS_DIR" -type f -exec shred -u {} +
          rm -rf "$KEYS_DIR"

      # Release-signed jars are not uploaded: on a public repo, any workflow artifact is
      # downloadable, and these would be production-signed builds of an unreleased commit.
      # Publishing to Maven Central (M2) will consume them directly from this job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.signing-keys != 'release'
        with:
          name: accp-signed-${{ inputs.signing-keys }}
          path: signed/
          if-no-files-found: error

  # Loads each signed platform jar as the JCA provider on every supported JDK. Corretto does not
  # enforce JCE signatures; an OracleJDK load test needs the release keys and is added with them.
  smoke-test:
    name: Smoke ${{ matrix.platform }}${{ matrix.fips && ' FIPS' || '' }} on JDK ${{ matrix.jdk }}
    needs: sign
    if: inputs.signing-keys == 'test'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch_64]
        fips: [false, true]
        jdk: ['8', '11', '17', '21']
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch_64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tests/ci/release
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accp-signed-${{ inputs.signing-keys }}
          path: signed

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'corretto'

      - name: Run smoke test
        run: |
          prefix=AmazonCorrettoCryptoProvider${{ matrix.fips && '-FIPS' || '' }}
          jar=$(ls signed/$prefix-[0-9]*-${{ matrix.platform }}.jar)
          version=$(basename "$jar" | sed -E "s/^$prefix-(.+)-${{ matrix.platform }}\.jar$/\1/")
          mkdir classes
          javac -cp "$jar" -d classes tests/ci/release/ReleaseSmokeTest.java
          java -cp "$jar:classes" ReleaseSmokeTest "$version" ${{ matrix.fips }}
